<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050b12" />
    <meta name="color-scheme" content="dark" />
    <title>UGS Files // Console</title>
    <style>
        :root {
            --bg: #050b12;
            --bg-soft: #08131b;
            --panel: rgba(7, 19, 27, 0.94);
            --panel-raised: #0b1b24;
            --panel-hover: #102832;
            --line: rgba(0, 255, 200, 0.24);
            --line-strong: rgba(0, 255, 200, 0.58);
            --accent: #00ffc8;
            --accent-soft: rgba(0, 255, 200, 0.12);
            --text: #e7fff9;
            --muted: #8eb4b0;
            --danger: #ff718d;
            --shadow: rgba(0, 0, 0, 0.52);
            --radius: 8px;
        }

        * { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                linear-gradient(rgba(0, 255, 200, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 200, 0.025) 1px, transparent 1px),
                radial-gradient(circle at 50% -10%, rgba(0, 255, 200, 0.10), transparent 38%),
                var(--bg);
            background-size: 32px 32px, 32px 32px, auto, auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            line-height: 1.5;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.06) 50%);
            background-size: 100% 4px;
            opacity: 0.45;
            z-index: 10;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover, a:focus-visible { color: #9cffe9; text-decoration: underline; }

        button, input { font: inherit; }
        button, input[type="button"] { -webkit-tap-highlight-color: transparent; }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: 86px;
            padding: 18px 10px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            overflow-y: auto;
            background: rgba(3, 10, 15, 0.94);
            border-right: 1px solid var(--line);
            box-shadow: 8px 0 28px var(--shadow);
            z-index: 20;
        }

        .sidebar::before {
            content: ">_";
            display: block;
            padding: 2px 0 12px;
            color: var(--accent);
            font-size: 1.25rem;
            font-weight: 800;
            text-align: center;
            text-shadow: 0 0 12px var(--accent);
        }

        .sidebar-btn {
            width: 100%;
            min-height: 48px;
            padding: 10px 5px;
            color: var(--accent);
            background: var(--panel-raised);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 800;
            box-shadow: inset 0 0 12px rgba(0, 255, 200, 0.035);
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .sidebar-btn:hover, .sidebar-btn:focus-visible {
            background: var(--accent-soft);
            border-color: var(--line-strong);
            transform: translateX(2px);
            outline: none;
        }

        .sidebar-btn.empty { opacity: 0.32; cursor: default; }
        .sidebar-btn.empty:hover { transform: none; background: var(--panel-raised); border-color: var(--line); }

        .main-content {
            min-height: 100vh;
            margin-left: 86px;
            padding: 30px 24px 48px;
        }

        .page-shell { width: min(100%, 1060px); margin: 0 auto; }

        .top-panel, .letter-section {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: 0 18px 38px var(--shadow), inset 0 1px rgba(255,255,255,0.025);
        }

        .top-panel {
            position: relative;
            padding: clamp(20px, 4vw, 34px);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .top-panel::after {
            content: "STATUS: ONLINE";
            position: absolute;
            top: 14px;
            right: 18px;
            color: var(--accent);
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            opacity: 0.8;
        }

        h1 {
            margin: 0 0 18px;
            color: var(--accent);
            text-align: center;
            font-size: clamp(1.65rem, 5vw, 2.8rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(0, 255, 200, 0.35);
        }

        h1::before { content: "[ "; color: var(--muted); }
        h1::after { content: " ]"; color: var(--muted); }

        .meta-links { display: grid; gap: 7px; text-align: center; }
        .meta-links .line { color: var(--muted); font-size: clamp(0.78rem, 2vw, 0.92rem); }
        .meta-links .line::before { content: "$ "; color: var(--accent); }
        .meta-links .line a { font-weight: 700; }

        .toolbar {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 10px;
            margin: 24px auto 0;
        }

        .search-wrap { flex: 1 1 420px; }

        .search-wrap input {
            width: 100%;
            min-height: 50px;
            padding: 13px 15px;
            color: var(--text);
            background: #030a0f;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            outline: none;
            box-shadow: inset 0 0 14px rgba(0,0,0,0.3);
        }

        .search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft), inset 0 0 14px rgba(0,0,0,0.3);
        }

        .search-wrap input::placeholder { color: #65827e; }

        .load-button {
            min-height: 50px;
            padding: 12px 20px;
            color: #00150f;
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            cursor: pointer;
            font-weight: 900;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(0, 255, 200, 0.2);
            transition: filter 0.15s ease, transform 0.15s ease;
        }

        .load-button:hover, .load-button:focus-visible { filter: brightness(1.15); transform: translateY(-1px); outline: none; }
        .load-button:active { transform: translateY(0); }

        #sections-container { display: flex; flex-direction: column; gap: 16px; }

        .letter-section { padding: 16px 16px 12px; }

        .letter-header {
            margin: 0 0 13px;
            padding: 0 0 10px;
            color: var(--accent);
            border-bottom: 1px dashed var(--line);
            font-size: clamp(1.25rem, 3vw, 1.8rem);
            letter-spacing: 0.08em;
        }

        .letter-header::before { content: "./"; color: var(--muted); }
        .buttons-container { display: flex; flex-direction: column; gap: 8px; }

        input[type="button"] {
            width: 100%;
            min-height: 50px;
            padding: 13px 15px;
            color: var(--text);
            text-align: left;
            background: var(--panel-raised);
            border: 1px solid rgba(0, 255, 200, 0.18);
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.15s ease, border-color 0.15s ease, padding-left 0.15s ease;
        }

        input[type="button"]::before { content: "> "; color: var(--accent); }
        input[type="button"]:hover, input[type="button"]:focus-visible {
            padding-left: 20px;
            background: var(--panel-hover);
            border-color: var(--line-strong);
            outline: none;
        }

        .empty-message { padding: 18px 10px 8px; color: var(--muted); text-align: center; font-style: italic; }

        @media (max-width: 700px) {
            body::before { display: none; }
            .sidebar {
                position: sticky;
                inset: auto;
                top: 0;
                width: 100%;
                height: auto;
                min-height: 64px;
                padding: max(9px, env(safe-area-inset-top)) 10px 9px;
                flex-direction: row;
                align-items: center;
                overflow-x: auto;
                overflow-y: hidden;
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }
            .sidebar::before { min-width: 34px; padding: 0; }
            .sidebar-btn { min-width: 52px; min-height: 46px; }
            .main-content { margin-left: 0; padding: 14px 12px max(32px, env(safe-area-inset-bottom)); }
            .top-panel { padding: 24px 15px 16px; }
            .top-panel::after { top: 8px; right: 10px; font-size: 0.58rem; }
            .toolbar { flex-direction: column; }
            .search-wrap, .load-button { width: 100%; }
        }

        @media (min-width: 701px) and (max-width: 960px) {
            .sidebar { width: 72px; }
            .main-content { margin-left: 72px; padding-left: 16px; padding-right: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar" aria-label="File navigation"></div>

    <main class="main-content">
        <div class="page-shell">
            <section class="top-panel" aria-labelledby="page-title">
                <h1 id="page-title">UGS Files</h1>

                <div class="meta-links">
                    <div class="line">
                        Files from
                        <a href="https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/" target="_blank" rel="noreferrer">Ultimate Game Stash Google Doc</a>
                    </div>
                    <div class="line">
                        Discord Server:
                        <a href="https://discord.gg/rmVsAqkpkA" target="_blank" rel="noreferrer">https://discord.gg/rmVsAqkpkA</a>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="search-wrap">
                        <input type="search" placeholder="Search files..." id="searchInput" aria-label="Search files" autocomplete="off" />
                    </div>
                    <button class="load-button" id="lolbutton" type="button">Load Files</button>
                </div>
            </section>

            <div id="sections-container"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>
</body>
</html>

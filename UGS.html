<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGS Files</title>
    <style>
        :root {
            --bg: #090d16;
            --bg-2: #111827;
            --panel: rgba(17, 24, 39, 0.92);
            --panel-soft: rgba(15, 21, 33, 0.75);
            --panel-border: rgba(122, 150, 255, 0.32);
            --accent: #7cc8ff;
            --accent-strong: #5fa2ff;
            --accent-alt: #6b8cff;
            --text: #edf4ff;
            --muted: #a8bbd9;
            --shadow: rgba(0, 0, 0, 0.45);
            --success: #84f0b1;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top, rgba(71, 98, 170, 0.30), transparent 30%),
                linear-gradient(180deg, #090d16 0%, #0b1220 30%, #0a0f1a 100%);
            color: var(--text);
            display: flex;
            line-height: 1.5;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            color: #cfe7ff;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 92px;
            height: 100vh;
            padding: 22px 12px;
            background: rgba(9, 12, 20, 0.8);
            border-right: 1px solid rgba(156, 176, 255, 0.18);
            backdrop-filter: blur(10px);
            box-shadow: 8px 0 24px rgba(0, 0, 0, 0.22);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.14);
            border-radius: 999px;
        }

        .sidebar-btn {
            width: 100%;
            min-height: 48px;
            padding: 12px 6px;
            border: 1px solid rgba(149, 178, 255, 0.28);
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(49, 71, 122, 0.85), rgba(17, 27, 50, 0.9));
            color: var(--text);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 18px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .sidebar-btn:hover {
            transform: translateY(-1px);
            border-color: rgba(159, 210, 255, 0.55);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 18px rgba(30, 43, 78, 0.35);
        }

        .sidebar-btn.empty {
            opacity: 0.35;
            cursor: default;
        }

        .sidebar-btn.empty:hover {
            transform: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 8px 18px rgba(0,0,0,0.2);
        }

        .main-content {
            flex: 1;
            margin-left: 108px;
            padding: 28px 22px 40px;
        }

        .page-shell {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-panel {
            background: linear-gradient(180deg, rgba(18, 24, 36, 0.94), rgba(11, 18, 28, 0.94));
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.28);
            padding: 26px 28px 22px;
            margin-bottom: 26px;
        }

        h1 {
            margin: 0 0 16px;
            color: var(--text);
            text-align: center;
            font-size: clamp(2rem, 2.4vw, 3rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 24px rgba(124, 200, 255, 0.18);
        }

        .meta-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .meta-links .line {
            color: var(--muted);
            font-size: 1.02rem;
            text-align: center;
            line-height: 1.6;
        }

        .meta-links .line a {
            color: var(--accent);
            font-weight: 600;
        }

        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 18px auto 30px;
            flex-wrap: wrap;
        }

        .search-wrap {
            width: min(100%, 480px);
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(140, 166, 255, 0.30);
            background: rgba(8, 14, 22, 0.8);
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .search-wrap input:focus {
            border-color: rgba(122, 180, 255, 0.75);
            box-shadow: 0 0 0 3px rgba(96, 150, 255, 0.18);
        }

        .search-wrap input::placeholder {
            color: rgba(191, 204, 229, 0.7);
        }

        .load-button {
            background: linear-gradient(180deg, #7aaefd, #4a7ae0);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(48, 95, 190, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .load-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(48, 95, 190, 0.42);
        }

        #sections-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .letter-section {
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.86), rgba(11, 17, 28, 0.9));
            border: 1px solid rgba(129, 152, 225, 0.22);
            border-radius: 14px;
            padding: 18px 18px 12px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.2);
        }

        .letter-header {
            margin: 0 0 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(160, 185, 255, 0.18);
            color: var(--text);
            font-size: clamp(1.6rem, 2vw, 2.2rem);
            letter-spacing: 0.04em;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="button"] {
            width: 100%;
            max-width: 100%;
            text-align: left;
            background: linear-gradient(180deg, rgba(28, 41, 64, 0.96), rgba(17, 26, 39, 0.96));
            border: 1px solid rgba(138, 175, 255, 0.26);
            border-radius: 10px;
            color: var(--text);
            padding: 16px 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
            transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        input[type="button"]:hover {
            transform: translateY(-1px);
            border-color: rgba(174, 208, 255, 0.52);
            box-shadow: 0 10px 20px rgba(0,0,0,0.16);
        }

        input[type="button"]:active {
            transform: translateY(0);
        }

        .empty-message {
            padding: 18px 10px 8px;
            color: rgba(195, 210, 234, 0.8);
            font-style: italic;
            text-align: center;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 72px;
                padding: 14px 8px;
            }

            .main-content {
                margin-left: 82px;
                padding-left: 12px;
                padding-right: 12px;
            }
        }

        @media (max-width: 640px) {
            .main-content {
                margin-left: 0;
                padding-top: 18px;
            }

            body {
                display: block;
            }

            .sidebar {
                position: sticky;
                top: 0;
                width: 100%;
                height: auto;
                flex-direction: row;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 12px 10px;
                border-right: none;
                border-bottom: 1px solid rgba(156, 176, 255, 0.18);
            }

            .sidebar-btn {
                min-width: 56px;
            }

            .toolbar {
                flex-direction: column;
            }

            .search-wrap {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>

    <div class="main-content">
        <div class="page-shell">
            <div class="top-panel">
                <h1>UGS Files</h1>

                <div class="meta-links">
                    <div class="line">
                        Files from
                        <a href="https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/" target="_blank" rel="noreferrer">
                            Ultimate Game Stash Google Doc
                        </a>
                    </div>

                    <div class="line">
                        Discord Server:
                        <a href="https://discord.gg/rmVsAqkpkA" target="_blank" rel="noreferrer">
                            https://discord.gg/rmVsAqkpkA
                        </a>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="search-wrap">
                        <input type="text" placeholder="Search..." id="searchInput" />
                    </div>
                    <button class="load-button" id="lolbutton">Load Files</button>
                </div>
            </div>

            <div id="sections-container"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>
</body>
</html>

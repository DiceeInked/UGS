<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>GameTonics by DiceeInked</title>
    <style>
        @font-face {
            font-family: "Monaspace Neon";
            src: url("https://cdn.jsdelivr.net/gh/githubnext/monaspace@main/fonts/variable/MonaspaceNeonVarVF%5Bwght,wdth,slnt%5D.woff2") format("woff2");
            font-style: normal;
            font-weight: 200 800;
            font-display: swap;
        }

        :root {
            --bg: #000000;
            --panel: rgba(2, 8, 6, 0.97);
            --panel-raised: #04120e;
            --panel-hover: #08221a;
            --cyan: #00ffc8;
            --pink: #ff0055;
            --line: rgba(0, 255, 200, 0.3);
            --line-strong: rgba(0, 255, 200, 0.75);
            --text: #e7fff9;
            --muted: #66a99b;
            --shadow: rgba(0, 0, 0, 0.8);
            --corner: 12px;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; background: var(--bg); }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 18px;
            color: var(--text);
            background:
                radial-gradient(circle at 50% -10%, rgba(0, 255, 200, 0.12), transparent 38%),
                #000;
            font-family: "Monaspace Neon", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.92rem;
            line-height: 1.45;
            text-shadow: 0 0 5px rgba(0, 255, 200, 0.28);
        }

        /* Inspired by Abyssal Bar's CRT treatment. */
        .scanlines {
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 255, 200, 0.045) 0,
                rgba(0, 255, 200, 0.045) 1px,
                transparent 1px,
                transparent 4px
            );
            mix-blend-mode: screen;
            opacity: 0.8;
        }

        a { color: var(--cyan); text-decoration: none; }
        a:hover, a:focus-visible { color: var(--pink); text-decoration: underline; }
        button, input { font: inherit; }
        button, input[type="button"] { -webkit-tap-highlight-color: transparent; }

        .app-window {
            position: relative;
            isolation: isolate;
            display: flex;
            width: min(1500px, 100%);
            min-height: min(900px, calc(100vh - 36px));
            max-height: calc(100vh - 36px);
            overflow: hidden;
            background: rgba(0, 8, 5, 0.9);
            border: 1px solid var(--cyan);
            border-radius: 0;
            clip-path: polygon(var(--corner) 0, calc(100% - var(--corner)) 0, 100% var(--corner), 100% calc(100% - var(--corner)), calc(100% - var(--corner)) 100%, var(--corner) 100%, 0 calc(100% - var(--corner)), 0 var(--corner));
            box-shadow: 0 0 0 1px rgba(255, 0, 85, 0.45), 0 24px 80px var(--shadow), 0 0 42px rgba(0, 255, 200, 0.14);
        }

        .app-window::before {
            content: "GAMETONICS BY DICEEINKED // FILE CONSOLE";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 34px;
            padding: 7px 16px;
            color: var(--muted);
            background: #020806;
            border-bottom: 1px solid var(--line);
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            z-index: 25;
        }

        .app-window::after {
            content: "●  ●  ●";
            position: absolute;
            top: 7px;
            right: 15px;
            color: var(--pink);
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            z-index: 26;
        }

        .sidebar {
            position: relative;
            flex: 0 0 86px;
            width: 86px;
            padding: 52px 10px 18px;
            display: flex;
            flex-direction: column;
            gap: 9px;
            overflow-y: auto;
            background: rgba(0, 8, 5, 0.96);
            border-right: 1px solid var(--line);
            box-shadow: 8px 0 28px var(--shadow);
            z-index: 20;
        }

        .sidebar::before { content: ">_"; display: block; padding: 2px 0 12px; color: var(--cyan); font-size: 1.1rem; font-weight: 800; text-align: center; text-shadow: 0 0 12px var(--cyan); }
        .sidebar-btn { width: 100%; min-height: 46px; padding: 9px 5px; color: var(--cyan); background: var(--panel-raised); border: 1px solid var(--line); border-radius: 0; clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); cursor: pointer; font-weight: 700; transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease; }
        .sidebar-btn:hover, .sidebar-btn:focus-visible { color: var(--pink); background: rgba(255, 0, 85, 0.1); border-color: var(--pink); transform: translateX(2px); outline: none; }
        .sidebar-btn.empty { opacity: 0.32; cursor: default; }
        .sidebar-btn.empty:hover { transform: none; background: var(--panel-raised); border-color: var(--line); }

        .main-content { min-width: 0; flex: 1; min-height: 100%; overflow-y: auto; padding: 64px 24px 48px; }
        .page-shell { width: min(100%, 1060px); margin: 0 auto; }
        .top-panel, .letter-section { background: var(--panel); border: 1px solid var(--line); border-radius: 0; clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); box-shadow: 0 18px 38px var(--shadow), inset 0 1px rgba(255,255,255,0.025); }
        .top-panel { position: relative; padding: clamp(18px, 3vw, 30px); margin-bottom: 20px; overflow: hidden; }
        .top-panel::after { content: "STATUS: ONLINE"; position: absolute; top: 12px; right: 16px; color: var(--pink); font-size: 0.62rem; letter-spacing: 0.08em; }
        h1 { margin: 0 0 16px; color: var(--cyan); text-align: center; font-size: clamp(1.45rem, 4vw, 2.35rem); letter-spacing: 0.1em; text-transform: uppercase; text-shadow: 0 0 18px rgba(0, 255, 200, 0.35); }
        h1::before { content: "[ "; color: var(--pink); } h1::after { content: " ]"; color: var(--pink); }
        .meta-links { display: grid; gap: 6px; text-align: center; }
        .meta-links .line { color: var(--muted); font-size: clamp(0.72rem, 1.8vw, 0.84rem); }
        .meta-links .line::before { content: "$ "; color: var(--pink); }
        .meta-links .line a { font-weight: 700; }
        .toolbar { display: flex; align-items: stretch; justify-content: center; gap: 9px; margin: 20px auto 0; }
        .search-wrap { flex: 1 1 420px; }
        .search-wrap input { width: 100%; min-height: 46px; padding: 11px 13px; color: var(--text); background: #010504; border: 1px solid var(--line); border-radius: 0; outline: none; }
        .search-wrap input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 0, 85, 0.16); }
        .search-wrap input::placeholder { color: #477d70; }
        .load-button { min-height: 46px; padding: 10px 18px; color: #000; background: var(--cyan); border: 1px solid var(--cyan); border-radius: 0; clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); cursor: pointer; font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; box-shadow: 0 0 18px rgba(0, 255, 200, 0.22); transition: filter 0.15s ease, transform 0.15s ease; }
        .load-button:hover, .load-button:focus-visible { filter: brightness(1.15); transform: translateY(-1px); outline: none; }
        .load-button:active { transform: translateY(0); }
        #sections-container { display: flex; flex-direction: column; gap: 14px; }
        .letter-section { padding: 14px 14px 10px; }
        .letter-header { margin: 0 0 11px; padding: 0 0 8px; color: var(--cyan); border-bottom: 1px dashed var(--line); font-size: clamp(1.1rem, 2.6vw, 1.55rem); letter-spacing: 0.07em; }
        .letter-header::before { content: "./"; color: var(--pink); }
        .buttons-container { display: flex; flex-direction: column; gap: 7px; }
        input[type="button"] { width: 100%; min-height: 46px; padding: 11px 13px; color: var(--text); text-align: left; background: var(--panel-raised); border: 1px solid rgba(0, 255, 200, 0.18); border-radius: 0; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.15s ease, border-color 0.15s ease, padding-left 0.15s ease; }
        input[type="button"]::before { content: "> "; color: var(--pink); }
        input[type="button"]:hover, input[type="button"]:focus-visible { padding-left: 18px; background: var(--panel-hover); border-color: var(--pink); outline: none; }
        .empty-message { padding: 16px 10px 7px; color: var(--muted); text-align: center; font-style: italic; }

        @media (max-width: 700px) {
            body { display: block; padding: 0; }
            .app-window { width: 100%; min-height: 100vh; max-height: none; display: block; clip-path: none; border: 0; }
            .app-window::before { position: sticky; display: block; top: 0; }
            .sidebar { position: sticky; top: 34px; width: 100%; height: auto; min-height: 60px; padding: 8px 10px; flex-direction: row; align-items: center; overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--line); }
            .sidebar::before { min-width: 34px; padding: 0; }
            .sidebar-btn { min-width: 50px; min-height: 44px; }
            .main-content { padding: 12px 10px max(28px, env(safe-area-inset-bottom)); overflow: visible; }
            .top-panel { padding: 22px 13px 14px; clip-path: none; }
            .top-panel::after { top: 7px; right: 9px; font-size: 0.54rem; }
            .toolbar { flex-direction: column; }
            .search-wrap, .load-button { width: 100%; }
            .letter-section { clip-path: none; }
        }

        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
    </style>
</head>
<body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="app-window">
        <div class="sidebar" id="sidebar" aria-label="File navigation"></div>
        <main class="main-content">
            <div class="page-shell">
                <section class="top-panel" aria-labelledby="page-title">
                    <h1 id="page-title">GameTonics by DiceeInked</h1>
                    <div class="meta-links">
                        <div class="line">Files from <a href="https://docs.google.com/document/d/1_FmH3BlSBQI7FGgAQL59-ZPe8eCxs35wel6JUyVaG8Q/" target="_blank" rel="noreferrer">Ultimate Game Stash Google Doc</a></div>
                        <div class="line">Discord Server: <a href="https://discord.gg/rmVsAqkpkA" target="_blank" rel="noreferrer">https://discord.gg/rmVsAqkpkA</a></div>
                    </div>
                    <div class="toolbar">
                        <div class="search-wrap"><input type="search" placeholder="Search games..." id="searchInput" aria-label="Search games" autocomplete="off" /></div>
                        <button class="load-button" id="lolbutton" type="button">Load Files</button>
                    </div>
                </section>
                <div id="sections-container"></div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameTonics — Grid</title>
<style>
:root{--cyan:#00ffc8;--pink:#ff0055;--black:#000;--grid:rgba(0,255,200,.16)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--black);color:var(--cyan);font-family:Impact,"Arial Narrow",Arial,sans-serif;letter-spacing:.04em}.scene{min-height:100vh;padding:clamp(18px,4vw,60px);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:42px 42px}.frame{max-width:1200px;margin:auto;border:3px solid var(--cyan);box-shadow:12px 12px 0 var(--pink);background:var(--black)}header{padding:clamp(20px,5vw,58px);display:grid;grid-template-columns:1fr auto;gap:25px;align-items:center;border-bottom:3px solid var(--cyan)}h1{margin:0;font-size:clamp(3rem,10vw,9rem);line-height:.78;text-transform:uppercase;letter-spacing:-.08em}h1 span{display:block;color:var(--pink);margin-left:.4em}.tag{max-width:180px;padding:12px;color:var(--black);background:var(--cyan);font-family:Arial,sans-serif;font-size:.75rem;font-weight:bold;line-height:1.3;transform:rotate(5deg)}.tools{display:flex;padding:14px;gap:10px;border-bottom:3px solid var(--cyan)}.search-wrap{flex:1}.search-wrap input{width:100%;height:48px;padding:0 14px;border:3px solid var(--cyan);background:var(--black);color:var(--cyan);font:16px Arial,sans-serif;outline:0}.search-wrap input:focus{border-color:var(--pink)}button{height:48px;padding:0 22px;background:var(--pink);color:var(--black);border:3px solid var(--pink);font:inherit;cursor:pointer}button:hover{background:var(--cyan);border-color:var(--cyan)}.body{display:grid;grid-template-columns:220px 1fr}aside{padding:18px;border-right:3px solid var(--cyan)}aside:before{content:"SELECT ZONE";display:block;margin-bottom:18px;color:var(--pink);font-size:1.2rem}#sidebar{display:grid;gap:9px}.sidebar-btn{padding:10px;color:var(--cyan);background:var(--black);border:2px solid var(--cyan);font:inherit;text-align:center;cursor:pointer}.sidebar-btn:hover,.sidebar-btn:focus-visible{color:var(--black);background:var(--cyan);outline:0}main{padding:22px}#sections-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}.letter-section{position:relative;padding:18px;border:3px solid var(--cyan);min-height:160px}.letter-section:nth-child(even){border-color:var(--pink);transform:translateY(14px)}.letter-header{margin:0 0 18px;color:var(--pink);font-size:2.4rem}.letter-header:after{content:" //";color:var(--cyan)}.buttons-container{display:grid;gap:8px}input[type=button]{padding:10px;color:var(--black);background:var(--cyan);border:0;font:bold 14px Arial,sans-serif;text-align:left;cursor:pointer}input[type=button]:hover,input[type=button]:focus-visible{color:var(--black);background:var(--pink);outline:0}.empty-message{font:14px Arial,sans-serif}@media(max-width:680px){.scene{padding:10px}.frame{box-shadow:6px 6px 0 var(--pink)}header{grid-template-columns:1fr}.tag{max-width:none;transform:none}.tools{flex-direction:column}.body{display:block}aside{border-right:0;border-bottom:3px solid var(--cyan)}#sidebar{display:flex;overflow:auto}.sidebar-btn{min-width:70px}main{padding:14px}#sections-container{grid-template-columns:1fr}.letter-section:nth-child(even){transform:none}}
</style></head>
<body><div class="scene"><div class="frame"><header><h1>Game<span>Tonics</span></h1><div class="tag">A HIGH-VOLTAGE INDEX OF GAME FILES BY DICEEINKED</div></header><div class="tools"><div class="search-wrap"><input type="search" id="searchInput" placeholder="TYPE TO FILTER" aria-label="Search games" autocomplete="off"></div><button id="lolbutton" type="button">LOAD FILES</button></div><div class="body"><aside id="sidebar" aria-label="File navigation"></aside><main><div id="sections-container"></div></main></div></div></div><script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script><script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script></body></html>

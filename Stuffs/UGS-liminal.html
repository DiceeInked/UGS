<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>UGS // liminal index</title>
<style>
:root{--ink:#090909;--paper:#f4f4f1;--fog:#bdbdb8;--line:rgba(255,255,255,.12);--dot:rgba(255,255,255,.32);--accent:#fff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink)}body{color:var(--paper);font:14px/1.5 Arial,Helvetica,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;z-index:-3;inset:0;background:linear-gradient(120deg,#fff 0%,#d7d7d4 18%,#73736f 47%,#292927 73%,#050505 100%);opacity:.56}body:after{content:"";position:fixed;z-index:-2;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 0 20%,rgba(0,0,0,.32) 72%,#000 100%)}button,input{font:inherit}.stage{min-height:100vh;padding:clamp(18px,4vw,58px);position:relative}.noise{position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:5;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}.shell{max-width:1180px;min-height:calc(100vh - clamp(36px,8vw,116px));margin:auto;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);box-shadow:0 25px 90px #0008;position:relative;overflow:hidden}.shell:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.2px);background-size:24px 24px;opacity:.72;mask-image:linear-gradient(90deg,#000,transparent 90%);pointer-events:none}.header{position:relative;padding:clamp(25px,5vw,65px) clamp(20px,6vw,78px) 22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.28em;color:#ddd;text-transform:uppercase}.header h1{font-size:clamp(42px,10vw,112px);line-height:.82;font-weight:400;letter-spacing:-.09em;margin:22px 0 12px;max-width:700px}.header h1 span{display:block;color:transparent;-webkit-text-stroke:1px #eee}.subtitle{max-width:470px;color:#bbb;font-size:12px;letter-spacing:.08em}.status{position:absolute;right:clamp(20px,6vw,78px);top:clamp(25px,5vw,65px);font-size:10px;letter-spacing:.18em;color:#aaa}.status i{display:inline-block;width:6px;height:6px;background:#fff;border-radius:50%;margin-right:7px;box-shadow:0 0 12px #fff}.controls{position:relative;display:flex;gap:15px;align-items:center;padding:18px clamp(20px,6vw,78px);border-bottom:1px solid var(--line);background:rgba(0,0,0,.27)}.search{flex:1;position:relative}.search input{width:100%;padding:13px 2px 12px 28px;border:0;border-bottom:1px solid #888;background:transparent;color:#fff;outline:0}.search:before{content:"⌕";position:absolute;left:3px;top:10px;font-size:20px;color:#aaa}.search input::placeholder{color:#999}.count{color:#999;font-size:11px;white-space:nowrap;letter-spacing:.1em}.content{position:relative;display:grid;grid-template-columns:minmax(180px,25%) 1fr;min-height:480px}.menu{padding:28px clamp(20px,4vw,50px);border-right:1px solid var(--line)}.menu h2{font-size:10px;font-weight:400;letter-spacing:.25em;color:#aaa;margin:0 0 28px}.menu button{display:block;width:100%;text-align:left;padding:11px 0;color:#bbb;background:none;border:0;border-bottom:1px solid #ffffff1a;cursor:pointer}.menu button:before{content:"·";color:#fff;font-size:25px;line-height:0;vertical-align:-3px;margin-right:12px}.menu button:hover,.menu button.active{color:#fff;padding-left:8px}.menu small{display:block;color:#777;margin-top:42px;line-height:1.7}.games{padding:34px clamp(20px,5vw,70px) 60px}.games-title{display:flex;justify-content:space-between;align-items:baseline;color:#aaa;font-size:10px;letter-spacing:.2em;margin-bottom:30px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0}.game{position:relative;min-height:125px;padding:19px 16px;border:1px solid #ffffff1c;margin:-1px 0 0 -1px;background:#0002;color:#eee;text-decoration:none;transition:.25s ease;overflow:hidden}.game:before{content:"";position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;right:14px;top:15px;box-shadow:0 0 10px #fff;transition:.25s}.game:hover,.game:focus-visible{background:#fff;color:#111;transform:translate(-4px,-4px);box-shadow:10px 10px 0 #0008;outline:0;z-index:2}.game:hover:before,.game:focus-visible:before{background:#111;box-shadow:none}.game .number{font-size:10px;color:#999}.game:hover .number{color:#555}.game .name{display:block;margin-top:22px;font-size:15px;letter-spacing:.02em}.game .hint{display:block;margin-top:6px;font-size:10px;color:#999}.game:hover .hint{color:#555}.empty{grid-column:1/-1;color:#aaa;padding:40px 0}.float-label{position:fixed;pointer-events:none;z-index:4;color:#fff;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:0;transform:translateY(8px);transition:.25s}.float-label.show{opacity:.7;transform:none}@media(max-width:650px){.status{position:static;margin-top:25px}.content{display:block}.menu{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:18px;overflow:auto;padding:15px 20px}.menu h2,.menu small{display:none}.menu button{white-space:nowrap;border:0;padding:6px}.games{padding-top:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="noise" aria-hidden="true"></div><div class="stage"><div class="shell">
<header class="header"><div class="eyebrow">Ultimate Game Stash / DiceeInked</div><div class="status"><i></i>INDEX: QUIET</div><h1>THE<br><span>EMPTY</span> ROOM</h1><div class="subtitle">A small collection of things left running in a place with no one around.</div></header>
<div class="controls"><label class="search"><input id="search" type="search" placeholder="type to make the room smaller..." autocomplete="off"></label><div class="count" id="count">00 FOUND</div></div>
<div class="content"><nav class="menu" aria-label="Game filters"><h2>FILTER / 01</h2><button class="active" data-filter="all">everything</button><button data-filter="arcade">arcade</button><button data-filter="quiet">quiet things</button><small>the grid is the menu.<br>each light is somewhere<br>you can go.</small></nav><main class="games"><div class="games-title"><span>AVAILABLE ROOMS</span><span id="clock">--:--:--</span></div><div class="grid" id="grid"></div></main></div>
</div></div><div class="float-label" id="floatLabel"></div>
<script>
/* Replace these sample links with your own games, or keep the file standalone. */
const games=[
 {name:'2048',type:'quiet',url:'https://play2048.co/'},{name:'Cookie Clicker',type:'quiet',url:'https://orteil.dashnet.org/cookieclicker/'},{name:'Tetris',type:'arcade',url:'https://tetris.com/play-tetris'},{name:'Snake',type:'arcade',url:'https://playsnake.org/'},{name:'A Dark Room',type:'quiet',url:'https://adarkroom.doublespeakgames.com/'},{name:'Minesweeper',type:'quiet',url:'https://minesweeper.online/'},{name:'The Final Earth 2',type:'arcade',url:'https://thefinalearth2.com/'},{name:'Solitaire',type:'quiet',url:'https://www.google.com/logos/2010/pacman10-i.html'}
];
const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count');let filter='all';
function render(){const query=search.value.trim().toLowerCase();const visible=games.filter(g=>(filter==='all'||g.type===filter)&&g.name.toLowerCase().includes(query));count.textContent=String(visible.length).padStart(2,'0')+' FOUND';grid.innerHTML=visible.length?visible.map((g,i)=>`<a class="game" href="${g.url}" target="_blank" rel="noopener"><span class="number">${String(i+1).padStart(2,'0')} / ${g.type}</span><span class="name">${g.name}</span><span class="hint">enter room →</span></a>`).join(''):'<div class="empty">Nothing here. The room is empty.</div>';document.querySelectorAll('.game').forEach(el=>el.addEventListener('mouseenter',()=>{const l=document.getElementById('floatLabel');l.textContent=el.querySelector('.name').textContent;l.classList.add('show')}));document.querySelectorAll('.game').forEach(el=>el.addEventListener('mouseleave',()=>document.getElementById('floatLabel').classList.remove('show')))}
document.querySelectorAll('.menu button').forEach(b=>b.addEventListener('click',()=>{document.querySelector('.menu .active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;render()}));search.addEventListener('input',render);setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour12:false}),1000);render();
</script>
</body></html>

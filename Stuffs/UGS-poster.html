<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameTonics — Index</title>
<style>
:root{--cyan:#00ffc8;--pink:#ff0055;--black:#090909;--paper:#111;--muted:#8b8b8b}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--cyan);font-family:Arial,Helvetica,sans-serif}.poster{width:min(1250px,100%);margin:0 auto;padding:clamp(18px,5vw,70px);min-height:100vh;position:relative;overflow:hidden}.poster:before{content:"UGS";position:absolute;top:-.22em;right:-.05em;color:var(--pink);font-size:clamp(10rem,35vw,32rem);font-weight:900;line-height:1;letter-spacing:-.1em;opacity:.12;pointer-events:none}.masthead{position:relative;border-bottom:12px solid var(--pink);padding-bottom:18px;display:flex;justify-content:space-between;gap:30px;align-items:end}.eyebrow{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--pink)}h1{margin:8px 0 0;font-size:clamp(3rem,10vw,8.5rem);line-height:.78;letter-spacing:-.09em;text-transform:uppercase;color:var(--cyan)}.issue{font-weight:bold;text-align:right;color:var(--pink);writing-mode:vertical-rl;transform:rotate(180deg)}.intro{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:35px;padding:25px 0 35px;border-bottom:1px solid var(--cyan)}.intro p{max-width:470px;font-size:1.1rem;line-height:1.35;margin:0}.intro p:first-letter{color:var(--pink);font-size:3em;font-weight:bold;float:left;line-height:.8;margin-right:5px}.toolbar{display:flex;gap:8px;align-items:start}.search-wrap{flex:1}.search-wrap input{width:100%;padding:14px;background:var(--paper);border:2px solid var(--cyan);color:var(--cyan);font:inherit;outline:0}.search-wrap input:focus{border-color:var(--pink)}button{padding:15px 18px;background:var(--pink);color:var(--black);border:2px solid var(--pink);font-weight:bold;cursor:pointer}button:hover{background:var(--cyan);border-color:var(--cyan)}.content{position:relative;display:grid;grid-template-columns:170px 1fr;gap:30px;padding-top:30px}aside{border-top:8px solid var(--cyan);padding-top:12px}aside:before{content:"BROWSE BY LETTER";display:block;margin-bottom:12px;color:var(--pink);font-size:.7rem;font-weight:bold;letter-spacing:.1em}#sidebar{display:grid;gap:4px}.sidebar-btn{padding:8px 0;color:var(--cyan);background:none;border:0;text-align:left;font:inherit;cursor:pointer}.sidebar-btn:hover,.sidebar-btn:focus-visible{color:var(--pink);padding-left:8px;outline:0}#sections-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.letter-section{background:var(--paper);border-top:8px solid var(--pink);padding:16px;min-height:130px}.letter-header{margin:0 0 16px;color:var(--cyan);font-size:2.5rem;line-height:1}.buttons-container{display:grid;gap:7px}input[type=button]{padding:8px 0;color:var(--cyan);background:none;border:0;border-bottom:1px solid #244c43;text-align:left;font:inherit;cursor:pointer}input[type=button]:hover,input[type=button]:focus-visible{color:var(--pink);border-color:var(--pink);outline:0}.empty-message{color:var(--muted)}@media(max-width:720px){.masthead{align-items:start}.issue{font-size:.7rem}.intro,.content{grid-template-columns:1fr}.toolbar{flex-direction:column}.toolbar>*{width:100%}aside{border-top-width:5px}#sidebar{display:flex;flex-wrap:wrap;gap:4px 18px}}
</style></head>
<body><div class="poster"><header class="masthead"><div><div class="eyebrow">The Ultimate Game Stash / DiceeInked</div><h1>Game<br>Tonics</h1></div><div class="issue">DIGITAL EDITION // 001</div></header><section class="intro"><p>Find the right file, fast. A curated index for players who like their library loud, useful, and organized.</p><div class="toolbar"><div class="search-wrap"><input type="search" id="searchInput" placeholder="Search the index..." aria-label="Search games" autocomplete="off"></div><button id="lolbutton" type="button">LOAD</button></div></section><div class="content"><aside id="sidebar" aria-label="File navigation"></aside><main><div id="sections-container"></div></main></div></div><script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script><script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameTonics — Terminal</title>
<style>
:root{--cyan:#00ffc8;--pink:#ff0055;--black:#050505;--dim:#101010;--gray:#a8a8a8}*{box-sizing:border-box}html{background:var(--black)}body{margin:0;min-height:100vh;background:var(--black);color:var(--cyan);font:14px/1.5 "Courier New",monospace}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,255,200,.04) 4px);z-index:10}.terminal{width:min(1100px,100%);min-height:100vh;margin:auto;border-left:1px solid var(--cyan);border-right:1px solid var(--cyan);background:var(--black)}header{padding:28px 24px 20px;border-bottom:1px dashed var(--cyan)}.prompt{color:var(--pink)}h1{margin:8px 0 5px;font-size:clamp(1.4rem,4vw,2.5rem);font-weight:400;letter-spacing:.03em}h1:before{content:"~/games$ ";color:var(--pink)}.subtitle{color:var(--gray)}.toolbar{display:flex;gap:10px;margin-top:25px}.search-wrap{flex:1}.search-wrap input{width:100%;padding:13px;color:var(--cyan);background:var(--dim);border:1px solid var(--cyan);font:inherit;outline:0}.search-wrap input:focus{box-shadow:4px 4px 0 var(--pink)}button{padding:0 20px;color:var(--black);background:var(--cyan);border:0;font:inherit;font-weight:bold;cursor:pointer}button:hover{color:var(--cyan);background:var(--pink)}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 170px)}aside{padding:20px 14px;border-right:1px dashed var(--cyan)}aside:before{content:"DIRECTORIES";display:block;margin-bottom:15px;color:var(--pink);font-size:11px}#sidebar{display:grid;gap:7px}.sidebar-btn{width:100%;padding:10px 8px;color:var(--cyan);background:transparent;border:1px solid transparent;text-align:left;font:inherit;cursor:pointer}.sidebar-btn:before{content:"./";color:var(--pink)}.sidebar-btn:hover,.sidebar-btn:focus-visible{border-color:var(--pink);outline:0}main{padding:20px 24px}.status{margin-bottom:20px;color:var(--gray)}.status b{color:var(--pink)}#sections-container{display:grid;gap:25px}.letter-section{border:1px solid var(--cyan);background:var(--dim)}.letter-header{margin:0;padding:10px 14px;color:var(--black);background:var(--cyan);font-size:1.1rem}.letter-header:before{content:"[";color:var(--pink);margin-right:8px}.buttons-container{padding:10px;display:grid;gap:6px}input[type=button]{padding:11px 12px;color:var(--cyan);background:var(--black);border:1px solid #26594f;text-align:left;font:inherit;cursor:pointer}input[type=button]:before{content:"> ";color:var(--pink)}input[type=button]:hover,input[type=button]:focus-visible{color:var(--black);background:var(--pink);border-color:var(--pink);outline:0}.empty-message{padding:15px;color:var(--gray)}@media(max-width:680px){.layout{display:block}aside{border-right:0;border-bottom:1px dashed var(--cyan);overflow:auto}#sidebar{display:flex;min-width:max-content}.sidebar-btn{width:auto}.toolbar{flex-direction:column}button{min-height:44px}main{padding:16px}}
</style>
</head>
<body><div class="terminal"><header><div class="prompt">DICEEINKED SYSTEM // CONNECTION SECURE</div><h1>GameTonics</h1><div class="subtitle">A searchable index of useful game files.</div><div class="toolbar"><div class="search-wrap"><input type="search" id="searchInput" placeholder="grep games..." aria-label="Search games" autocomplete="off"></div><button id="lolbutton" type="button">RUN LOAD</button></div></header><div class="layout"><aside id="sidebar" aria-label="File navigation"></aside><main><div class="status">STATUS: <b>ONLINE</b> // FILES: STREAMING</div><div id="sections-container"></div></main></div></div><script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/searchbut.js"></script><script src="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js"></script></body></html>
